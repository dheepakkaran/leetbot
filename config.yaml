owner_name: Dheepak
timezone: America/New_York

schedule:
  morning_local_hour: 8        # send at/after 08:00 local
  evening_local_hour: 18       # nudge at 18:xx local
  sync_every_hours: 2

languages:
  block_size: 10
  cycle: [cpp, python, java, java, python, cpp]   # 60-problem cycle, then repeats

picker:
  difficulty_by_weekday:       # Monday=0 ... Sunday=6, local date
    0: Easy
    1: Medium
    2: Medium
    3: Easy
    4: Medium
    5: Hard
    6: Medium
  core_patterns:               # LeetCode topic tag slugs
    - array
    - hash-table
    - two-pointers
    - sliding-window
    - stack
    - binary-search
    - linked-list
    - tree
    - graph
    - heap-priority-queue
    - backtracking
    - dynamic-programming
    - greedy
    - trie
    - bit-manipulation
  acrate_ranges:               # prefer problems inside these acceptance ranges
    Easy: [45, 100]
    Medium: [35, 75]
    Hard: [0, 100]
  problems_cache_days: 7

llm:
  provider: gemini             # Google AI Studio free tier (GitHub Models was retired on 2026-07-30)
  endpoint: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
  api_key_env: GEMINI_API_KEY  # env var / Actions secret that holds the API key
  models:                      # tried in order with the same key
    - gemini-3.8-flash
    - gemini-3.6-flash
    - gemini-3.5-flash-lite
  temperature: 0.2
  reasoning_effort: medium     # Gemini 3 always thinks; this sets how much (minimal/low/medium/high)
  max_output_tokens: 16000     # room for the thinking plus the JSON answer
  max_retries_per_model: 2

milestones:
  solved_every: 50
  streak_days: [7, 30, 50, 100]

telegram:
  reaction_on_solve: "💯"      # must be in Telegram's allowed reaction set (✅ is not)
