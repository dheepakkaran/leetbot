name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "log.csv"
      - "data/**"
      - "easy/**"
      - "medium/**"
      - "hard/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
